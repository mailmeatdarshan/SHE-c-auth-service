name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    build-and-test:
        name: Build the project
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: root
                    POSTGRES_DB: she_auth_service_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run eslint
              run: npm run lint

            - name: Test and coverage
              run: npm run test
              env:
                  NODE_ENV: test
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_USERNAME: root
                  DB_PASSWORD: root
                  DB_NAME: she_auth_service_test
                  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET || 'authservicerefreshtokensecret' }}
                  JWKS_URI: ${{ secrets.JWKS_URI || 'http://localhost:5001/.well-known/jwks.json' }}
                  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

            - name: Build-ts
              run: npm run build

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    build-and-push-docker:
        name: Build and Push Docker Image
        needs: build-and-test
        runs-on: ubuntu-latest

        env:
            IMAGE_NAME: darshanlabs/she_auth_service
            IMAGE_TAG: build-${{ github.run_number }}

        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build Docker Image
              run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f docker/prod/Dockerfile .

            - name: Push Docker Image To Docker Hub
              run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
